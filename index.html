<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sofi & Taner Budget">
<title>Sofi & Taner Budget</title>
<style>
  :root {
    --bg: #ffffff; --bg2: #f5f5f4; --bg3: #ebe9e4;
    --text: #1a1a18; --text2: #6b6b67; --text3: #9a9a96;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.2);
    --success: #0f6e56; --danger: #a32d2d; --info: #185fa5;
    --radius: 10px; --radius-lg: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg2: #252523; --bg3: #2e2e2c;
      --text: #f0ede8; --text2: #a0a09c; --text3: #6a6a66;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
      --success: #5DCAA5; --danger: #F09595; --info: #85B7EB;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg3); color: var(--text); font-size: 15px; }
  .app { max-width: 480px; margin: 0 auto; background: var(--bg); min-height: 100vh; }
  .topbar { padding: 16px 16px 0; display: flex; align-items: center; justify-content: space-between; }
  .topbar-title { font-size: 18px; font-weight: 600; }
  .sync-pill { display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 99px; background: var(--bg2); font-size: 12px; color: var(--text2); border: 0.5px solid var(--border); }
  .sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); }
  .sdot.ok { background: #1D9E75; } .sdot.err { background: #E24B4A; } .sdot.spin { background: #EF9F27; }
  .nav { display: flex; padding: 12px 16px; gap: 6px; overflow-x: auto; border-bottom: 0.5px solid var(--border); }
  .nav button { flex-shrink: 0; font-size: 13px; padding: 7px 13px; border-radius: var(--radius); border: 0.5px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; }
  .nav button.active { background: var(--bg2); color: var(--text); font-weight: 500; border-color: var(--border2); }
  .nav button.recurring-tab { color: var(--danger); border-color: rgba(163,45,45,0.45); background: rgba(163,45,45,0.08); font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .nav button.recurring-tab { border-color: rgba(240,149,149,0.5); background: rgba(240,149,149,0.12); }
  }
  .nav button.recurring-tab.active { background: var(--danger); color: #fff; border-color: var(--danger); }
  .section { display: none; padding: 16px; } .section.active { display: block; }
  .month-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .month-nav span { flex: 1; text-align: center; font-weight: 500; font-size: 15px; }
  .btn-sm { font-size: 13px; padding: 6px 12px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--bg2); color: var(--text); cursor: pointer; font-family: inherit; }
  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .metric { background: var(--bg2); border-radius: var(--radius); padding: 12px; }
  .metric .mlabel { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
  .metric .mval { font-size: 19px; font-weight: 600; }
  .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px; margin-bottom: 12px; }
  .card-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
  label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 4px; }
  input, select { width: 100%; padding: 10px 12px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg2); color: var(--text); font-size: 15px; font-family: inherit; margin-bottom: 10px; -webkit-appearance: none; }
  input:focus, select:focus { outline: none; border-color: var(--info); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-row > div input, .form-row > div select { width: 100%; }
  .btn-primary { width: 100%; padding: 13px; border-radius: var(--radius); border: none; background: #1D9E75; color: white; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 4px; }
  .btn-primary:active { opacity: .85; }
  .tx-item { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 0.5px solid var(--border); }
  .tx-item:last-child { border-bottom: none; }
  .tx-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .tx-info { flex: 1; min-width: 0; }
  .tx-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-meta { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .tx-amt { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .tx-amt.income { color: var(--success); } .tx-amt.expense { color: var(--danger); } .tx-amt.savings { color: var(--info); }
  .btn-del { background: none; border: none; color: var(--text3); cursor: pointer; padding: 6px; font-size: 18px; }
  .prog-bg { background: var(--bg2); border-radius: 4px; height: 7px; margin-top: 5px; }
  .prog-fill { height: 7px; border-radius: 4px; }
  .empty { text-align: center; color: var(--text3); padding: 24px 0; font-size: 14px; }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 99px; font-weight: 600; margin-left: 5px; }
  .badge-income { background: #EAF3DE; color: #27500A; }
  .badge-expense { background: #FCEBEB; color: #791F1F; }
  .badge-savings { background: #E6F1FB; color: #0C447C; }
  .msg { font-size: 13px; min-height: 18px; margin-top: 8px; text-align: center; }
  .cat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .cat-row .clabel { flex: 1; font-size: 14px; }
  .cat-row input { width: 100px; margin-bottom: 0; }
  .legend { display: flex; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; }
  .leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
  .leg-sq { width: 10px; height: 10px; border-radius: 2px; }
  .install-bar { background: var(--bg2); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; font-size: 13px; color: var(--text2); border: 0.5px solid var(--border); line-height: 1.6; }
  .repeat-row { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; padding: 10px 12px; border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--bg2); color: var(--text); font-size: 13px; cursor: pointer; }
  .repeat-row input { accent-color: var(--danger); }
  .repeat-row.active { border-color: var(--danger); background: rgba(163,45,45,0.12); color: var(--danger); font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .repeat-row.active { background: rgba(240,149,149,0.16); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar" style="padding-top: max(16px, env(safe-area-inset-top));">
    <div class="topbar-title">Sofi & Taner Budget</div>
    <div class="sync-pill">
      <div class="sdot spin" id="sdot"></div>
      <span id="slabel">Connecting...</span>
      <button class="btn-sm" onclick="syncNow()" style="padding:3px 8px;font-size:11px;margin-left:4px;border:none;background:transparent;">Refresh</button>
    </div>
  </div>

  <div class="nav">
    <button class="active" onclick="nav('overview',this)">Overview</button>
    <button onclick="nav('add',this)">+ Add</button>
    <button onclick="nav('transactions',this)">Transactions</button>
    <button class="recurring-tab" onclick="nav('recurring',this)">Recurring</button>
    <button onclick="nav('budget',this)">Goals</button>
  </div>

  <!-- OVERVIEW -->
  <div id="sec-overview" class="section active">
    <div class="month-nav">
      <button class="btn-sm" onclick="chMonth(-1)">&lt;</button>
      <span id="ml1"></span>
      <button class="btn-sm" onclick="chMonth(1)">&gt;</button>
    </div>
    <div class="metric-grid" id="metrics"></div>
    <div class="card">
      <div class="card-title">Expenses by category</div>
      <div id="cat-summary"></div>
    </div>
    <div class="card">
      <div class="card-title">6-month chart</div>
      <div class="legend">
        <span class="leg"><span class="leg-sq" style="background:#5DCAA5"></span>Income</span>
        <span class="leg"><span class="leg-sq" style="background:#F09595"></span>Expenses</span>
        <span class="leg"><span class="leg-sq" style="background:#85B7EB"></span>Savings</span>
      </div>
      <div style="position:relative;height:180px;">
        <canvas id="chart" role="img" aria-label="Monthly income expenses and savings chart"></canvas>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Recent</div>
      <div id="recent"></div>
    </div>
    <div class="card">
      <div class="card-title">Recurring this month</div>
      <div id="recurring-summary"></div>
    </div>
  </div>

  <!-- ADD -->
  <div id="sec-add" class="section">
    <div class="card">
      <div class="card-title">New entry</div>
      <div class="form-row">
        <div><label>Type</label>
          <select id="f-type" onchange="updateCatOptions()">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
            <option value="savings">Savings</option>
          </select>
        </div>
        <div><label>Person</label>
          <select id="f-person">
            <option>Taner</option><option>Sofiya</option>
          </select>
        </div>
      </div>
      <label>Description</label>
      <input type="text" id="f-desc" placeholder="Groceries, bill, fuel...">
      <label>Amount (EUR)</label>
      <input type="number" id="f-amount" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
      <div class="form-row">
        <div><label>Category</label><select id="f-cat" onchange="updateSalaryOptions()"></select></div>
        <div><label>Date</label><input type="date" id="f-date"></div>
      </div>
      <div id="salary-options" style="display:none;">
        <label>Salary payment</label>
        <select id="f-salary-frequency">
          <option value="monthly">Monthly</option>
          <option value="weekly">Weekly</option>
        </select>
      </div>
      <label class="repeat-row" id="repeat-row">
        <input type="checkbox" id="f-repeat" onchange="toggleRepeatStyle()" style="width:auto;margin:0;">
        Repeat this expense every month
      </label>
      <button class="btn-primary" onclick="addTx()">Add & sync to Google Sheets</button>
      <div class="msg" id="f-msg"></div>
    </div>
  </div>

  <!-- TRANSACTIONS -->
  <div id="sec-transactions" class="section">
    <div class="month-nav">
      <button class="btn-sm" onclick="chMonth(-1)">&lt;</button>
      <span id="ml2"></span>
      <button class="btn-sm" onclick="chMonth(1)">&gt;</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
      <select onchange="renderTxList()" id="filter-type" style="flex:1;margin:0;font-size:13px;padding:8px;">
        <option value="">All types</option>
        <option value="expense">Expense</option>
        <option value="income">Income</option>
        <option value="savings">Savings</option>
      </select>
      <select onchange="renderTxList()" id="filter-person" style="flex:1;margin:0;font-size:13px;padding:8px;">
        <option value="">All people</option>
        <option>Taner</option><option>Sofiya</option>
      </select>
    </div>
    <div class="card"><div id="tx-list"></div></div>
  </div>

  <!-- RECURRING -->
  <div id="sec-recurring" class="section">
    <div class="month-nav">
      <button class="btn-sm" onclick="chMonth(-1)">&lt;</button>
      <span id="ml4"></span>
      <button class="btn-sm" onclick="chMonth(1)">&gt;</button>
    </div>
    <div class="card">
      <div class="card-title">Monthly recurring expenses</div>
      <div id="rec-monthly"></div>
    </div>
  </div>

  <!-- BUDGET GOALS -->
  <div id="sec-budget" class="section">
    <div class="card">
      <div class="card-title">Monthly goals (EUR)</div>
      <div id="budget-inputs"></div>
      <button class="btn-primary" onclick="saveBudgets()" style="background:#534AB7;">Save goals</button>
      <div class="msg" id="b-msg" style="color:var(--success);"></div>
    </div>
    <div class="card">
      <div class="card-title">Goal status</div>
      <div class="month-nav" style="margin-bottom:.5rem;">
        <button class="btn-sm" onclick="chMonth(-1)">&lt;</button>
        <span id="ml3"></span>
        <button class="btn-sm" onclick="chMonth(1)">&gt;</button>
      </div>
      <div id="budget-status"></div>
    </div>
  </div>
</div>

<script>
const GS_URL = 'https://script.google.com/macros/s/AKfycby7mfRxjZH-KXpCXrl-olIWorMnhD4kXiulzKpY_B-m-qJCc6qgvhe3dLsnVa_fsnC1/exec';

const EXPENSE_CATS=[
  {id:'groceries',label:'Groceries',color:'#1D9E75'},
  {id:'housing',label:'Housing',color:'#534AB7'},
  {id:'bills',label:'Bills',color:'#378ADD'},
  {id:'transport',label:'Transportation',color:'#D85A30'},
  {id:'car',label:'Car',color:'#BA7517'},
  {id:'entertainment',label:'Entertainment',color:'#D4537E'},
  {id:'family',label:'Family',color:'#993556'},
  {id:'other',label:'Other',color:'#5F5E5A'},
];
const INCOME_CATS=[
  {id:'salary',label:'Salary',color:'#3B6D11'},
  {id:'extra_income',label:'Extra income',color:'#1D9E75'},
  {id:'other_income',label:'Other income',color:'#5F5E5A'},
];
const SAVINGS_CATS=[
  {id:'general_savings',label:'General savings',color:'#185FA5'},
  {id:'emergency',label:'Emergency fund',color:'#0C447C'},
  {id:'goal_savings',label:'Goal savings',color:'#378ADD'},
];
const ALL_CATS=[...EXPENSE_CATS,...INCOME_CATS,...SAVINGS_CATS];
const catById=id=>ALL_CATS.find(c=>c.id===id)||{label:id,color:'#888780'};
const catColor=id=>catById(id).color;
const catLabel=id=>catById(id).label;
const typeClass=type=>type;
const typeLabel=type=>type==='income'?'Income':type==='savings'?'Savings':'Expense';
const typeSign=type=>type==='income'?'+':type==='savings'?'->':'-';
const typeFromSheet=type=>{
  const value=String(type||'').toLowerCase();
  if(value==='gelir')return 'income';
  if(value==='birikim')return 'savings';
  if(value==='gider')return 'expense';
  if(value==='income'||value==='savings'||value==='expense')return value;
  return 'expense';
};
const typeToSheet=type=>type==='income'?'gelir':type==='savings'?'birikim':'gider';
const txMonth=t=>(t.month||String(t.date||'').slice(0,7));
const txDateTime=t=>t.createdAt||t.date||'';
const localDateTime=()=>{
  const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);
  return d.toISOString().slice(0,19).replace('T',' ');
};

let transactions=[], budgets={}, recurring=[], deletedKeys=[], currentMonth=new Date().toISOString().slice(0,7), chartInst=null;

const saveLocal=()=>{try{localStorage.setItem('fb_tx',JSON.stringify(transactions));localStorage.setItem('fb_bud',JSON.stringify(budgets));localStorage.setItem('fb_rec',JSON.stringify(recurring));localStorage.setItem('fb_deleted',JSON.stringify(deletedKeys));}catch(e){}};
const loadLocal=()=>{try{
  transactions=JSON.parse(localStorage.getItem('fb_tx')||'[]').map(t=>({...t,type:typeFromSheet(t.type),month:t.month||String(t.date||'').slice(0,7)}));
  budgets=JSON.parse(localStorage.getItem('fb_bud')||'{}');
  const savedRecurring=JSON.parse(localStorage.getItem('fb_rec')||'[]');
  recurring=Array.isArray(savedRecurring)?savedRecurring:[];
  const savedDeleted=JSON.parse(localStorage.getItem('fb_deleted')||'[]');
  deletedKeys=Array.isArray(savedDeleted)?savedDeleted:[];
}catch(e){}};

const fmt=n=>'EUR '+Math.abs(n).toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2});
const monthName=ym=>{const[y,m]=ym.split('-');return new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});};
const chMonth=d=>{const[y,m]=currentMonth.split('-').map(Number);currentMonth=new Date(y,m-1+d,1).toISOString().slice(0,7);renderAll();};
const manualMonthTx=(ym)=>transactions.filter(t=>txMonth(t)===(ym||currentMonth));
const txKey=t=>[txMonth(t),txDateTime(t),typeFromSheet(t.type),String(t.person||''),String(t.desc||''),String(t.cat||''),String(parseFloat(t.amount||0))].join('|');
const weeklyCountInMonth=(ym,weekday)=>{
  const year=parseInt(ym.slice(0,4),10),month=parseInt(ym.slice(5,7),10)-1;
  let count=0,d=new Date(year,month,1);
  while(d.getMonth()===month){if(d.getDay()===weekday)count++;d.setDate(d.getDate()+1);}
  return count;
};
const isoDate=d=>{
  const copy=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  copy.setMinutes(copy.getMinutes()-copy.getTimezoneOffset());
  return copy.toISOString().slice(0,10);
};
const parseDate=value=>{
  const match=String(value||'').match(/\d{4}-\d{2}-\d{2}/);
  if(!match)return null;
  const [y,m,d]=match[0].split('-').map(Number);
  const parsed=new Date(y,m-1,d);
  return isNaN(parsed.getTime())?null:parsed;
};
const daysInMonth=(year,monthIndex)=>new Date(year,monthIndex+1,0).getDate();
const recurringStartDate=item=>parseDate(item.startDate)||parseDate(item.date)||parseDate(item.createdAt)||new Date();
const recurringDueDatesForMonth=(item,ym=currentMonth)=>{
  const start=recurringStartDate(item);
  const year=parseInt(ym.slice(0,4),10),month=parseInt(ym.slice(5,7),10)-1;
  const monthStart=new Date(year,month,1);
  const monthEnd=new Date(year,month,daysInMonth(year,month));
  const frequency=item.frequency||'monthly';
  if(monthEnd<start)return [];
  if(frequency==='weekly'||frequency==='biweekly'){
    const step=frequency==='weekly'?7:14;
    const dates=[];
    let d=new Date(start.getFullYear(),start.getMonth(),start.getDate());
    while(d<monthStart)d.setDate(d.getDate()+step);
    while(d<=monthEnd){dates.push(isoDate(d));d.setDate(d.getDate()+step);}
    return dates;
  }
  if(frequency==='yearly'){
    if(month!==start.getMonth())return [];
    const day=Math.min(start.getDate(),daysInMonth(year,month));
    const d=new Date(year,month,day);
    return d>=start?[isoDate(d)]:[];
  }
  const day=Math.min(start.getDate(),daysInMonth(year,month));
  const d=new Date(year,month,day);
  return d>=start?[isoDate(d)]:[];
};
const recurringForMonth=(ym=currentMonth)=>{
  return recurring.filter(item=>parseFloat(item.amount||0)>0).flatMap(item=>{
    const type=typeFromSheet(item.type||'expense');
    const baseAmount=parseFloat(item.amount||0);
    return recurringDueDatesForMonth(item,ym).map((dueDate,index)=>({
      type,
      person:item.person||'Recurring',
      desc:item.desc,
      amount:baseAmount,
      cat:item.cat||'other',
      date:dueDate,
      month:dueDate.slice(0,7),
      createdAt:dueDate+' • Recurring',
      recurring:true,
      recId:item.id,
      occurrence:index+1
    }));
  });
};
const monthTx=(ym)=>[...manualMonthTx(ym),...recurringForMonth(ym)];

const setSyncState=(state,txt)=>{
  const dot=document.getElementById('sdot'), lbl=document.getElementById('slabel');
  dot.className='sdot'+(state==='ok'?' ok':state==='err'?' err':state==='spin'?' spin':'');
  lbl.textContent=txt;
};

async function syncNow(){
  setSyncState('spin','Syncing...');
  try{
    const r=await fetch(GS_URL+'?action=get&t='+Date.now());
    const raw=await r.json();
    const rows=Array.isArray(raw)?raw:(Array.isArray(raw.rows)?raw.rows:[]);
    if(rows.length>0){
      const first=rows[0]||[];
      const header=String(first[0]||'').toLowerCase();
      const hasNewHeader=header.includes('kayit') || String(first[1]||'').toLowerCase()==='ay';
      const hasOldHeader=header==='date';
      const start=(hasNewHeader||hasOldHeader)?1:0;
      transactions=rows.slice(start).map((row,i)=>{
        if(hasNewHeader){
          return {
            createdAt:String(row[0]||''),
            month:String(row[1]||''),
            type:typeFromSheet(row[2]),
            person:String(row[3]||''),
            desc:String(row[4]||''),
            cat:String(row[5]||'other'),
            amount:parseFloat(row[6])||0,
            _row:start+i
          };
        }
        return {
          date:String(row[0]||''),
          month:String(row[0]||'').slice(0,7),
          type:typeFromSheet(row[1]),
          person:String(row[2]||''),
          desc:String(row[3]||''),
          cat:String(row[4]||'other'),
          amount:parseFloat(row[5])||0,
          _row:start+i
        };
      }).filter(t=>txMonth(t).length===7 && t.amount>0 && !deletedKeys.includes(txKey(t)));
      saveLocal();
    }
    setSyncState('ok','Synced '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
    renderAll();
  }catch(e){
    setSyncState('err','Offline');
  }
}

async function pushTx(tx){
  const p=new URLSearchParams({action:'add',date:tx.date,type:typeToSheet(tx.type),person:tx.person,desc:tx.desc,cat:tx.cat,amount:tx.amount});
  await fetch(GS_URL+'?'+p);
  await syncNow();
}

async function deleteTxRemote(idx){
  if(!confirm('Delete this entry?'))return;
  const tx=transactions[idx];
  const key=txKey(tx);
  if(!deletedKeys.includes(key))deletedKeys.push(key);
  transactions.splice(idx,1); saveLocal(); renderAll();
  if(tx._row!==undefined&&tx._row!==null){
    try{
      const res=await fetch(GS_URL+'?action=delete&row='+encodeURIComponent(tx._row)+'&t='+Date.now());
      let body=null;
      try{body=await res.json();}catch(e){}
      if(body&&body.ok){
        deletedKeys=deletedKeys.filter(k=>k!==key);
        saveLocal();
      }
      await syncNow();
    }catch(e){
      setSyncState('err','Delete saved locally');
    }
  }
}

function nav(s,btn){
  document.querySelectorAll('.section').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(el=>el.classList.remove('active'));
  document.getElementById('sec-'+s).classList.add('active');
  btn.classList.add('active');
  if(s==='overview')setTimeout(renderChart,50);
}

function updateCatOptions(){
  const type=document.getElementById('f-type').value;
  const cats=type==='income'?INCOME_CATS:type==='savings'?SAVINGS_CATS:EXPENSE_CATS;
  document.getElementById('f-cat').innerHTML=cats.map(c=>`<option value="${c.id}">${c.label}</option>`).join('');
  updateSalaryOptions();
  const repeat=document.getElementById('f-repeat');
  if(repeat){
    repeat.disabled=type!=='expense';
    if(type!=='expense')repeat.checked=false;
    toggleRepeatStyle();
  }
}

function updateSalaryOptions(){
  const type=document.getElementById('f-type').value;
  const cat=document.getElementById('f-cat').value;
  const box=document.getElementById('salary-options');
  if(!box)return;
  box.style.display=(type==='income'&&cat==='salary')?'block':'none';
}

function toggleRepeatStyle(){
  const row=document.getElementById('repeat-row');
  const repeat=document.getElementById('f-repeat');
  if(!row||!repeat)return;
  row.classList.toggle('active',repeat.checked&&!repeat.disabled);
  row.style.opacity=repeat.disabled?'.55':'1';
}

async function addTx(){
  const type=document.getElementById('f-type').value;
  const person=document.getElementById('f-person').value;
  const desc=document.getElementById('f-desc').value.trim();
  const amount=parseFloat(document.getElementById('f-amount').value);
  const cat=document.getElementById('f-cat').value;
  const date=document.getElementById('f-date').value;
  const repeat=document.getElementById('f-repeat').checked;
  const msg=document.getElementById('f-msg');
  if(!desc||!amount||!date){msg.style.color='var(--danger)';msg.textContent='Please fill in all fields.';return;}
  if(type==='income'&&cat==='salary'){
    const frequency=document.getElementById('f-salary-frequency').value;
    const salaryDate=new Date(date+'T00:00:00');
    recurring.push({
      id:'rec_'+Date.now(),
      type:'income',
      frequency,
      weekday:salaryDate.getDay(),
      desc,
      amount,
      cat,
      person,
      createdAt:localDateTime(),
      startDate:date
    });
    saveLocal();renderAll();
    msg.style.color='var(--success)';msg.textContent='Recurring salary saved.';
    document.getElementById('f-desc').value='';document.getElementById('f-amount').value='';
    setTimeout(()=>msg.textContent='',3000);
    return;
  }
  if(repeat&&type==='expense'){
    recurring.push({
      id:'rec_'+Date.now(),
      type:'expense',
      frequency:'monthly',
      desc,
      amount,
      cat,
      person,
      createdAt:localDateTime(),
      startDate:date
    });
    saveLocal();renderAll();
    msg.style.color='var(--success)';msg.textContent='Monthly recurring expense saved.';
    document.getElementById('f-desc').value='';document.getElementById('f-amount').value='';document.getElementById('f-repeat').checked=false;
    toggleRepeatStyle();
    setTimeout(()=>msg.textContent='',3000);
    return;
  }
  const tx={
    type,
    person,
    desc,
    amount,
    cat,
    date,
    month:date.slice(0,7),
    createdAt:localDateTime()
  };
  transactions.push(tx); saveLocal(); renderAll();
  msg.style.color='var(--success)'; msg.textContent='Saving...';
  document.getElementById('f-desc').value=''; document.getElementById('f-amount').value='';
  try{await pushTx(tx); msg.textContent='Saved & synced.';}catch(e){msg.textContent='Saved locally, sync failed.';}
  setTimeout(()=>msg.textContent='',3000);
}

function renderMetrics(){
  const tx=monthTx();
  const income=tx.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);
  const expense=tx.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
  const savings=tx.filter(t=>t.type==='savings').reduce((a,t)=>a+t.amount,0);
  const balance=income-expense-savings;
  document.getElementById('metrics').innerHTML=`
    <div class="metric"><div class="mlabel">Income</div><div class="mval" style="color:var(--success)">${fmt(income)}</div></div>
    <div class="metric"><div class="mlabel">Monthly expenses</div><div class="mval" style="color:var(--danger)">${fmt(expense)}</div></div>
    <div class="metric"><div class="mlabel">Savings</div><div class="mval" style="color:var(--info)">${fmt(savings)}</div></div>
    <div class="metric"><div class="mlabel">Balance</div><div class="mval" style="color:${balance>=0?'var(--success)':'var(--danger)'}">${balance>=0?'':'-'}${fmt(balance)}</div></div>`;
}

function renderCatSummary(){
  const tx=monthTx().filter(t=>t.type==='expense');
  const totals={};tx.forEach(t=>{totals[t.cat]=(totals[t.cat]||0)+t.amount;});
  const total=Object.values(totals).reduce((a,b)=>a+b,0);
  if(!total){document.getElementById('cat-summary').innerHTML='<p class="empty">No expenses this month</p>';return;}
  document.getElementById('cat-summary').innerHTML=Object.entries(totals).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>{
    const pct=Math.round(amt/total*100);
    return`<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:12px;"><span>${catLabel(cat)}</span><span style="color:var(--text2)">${fmt(amt)} · ${pct}%</span></div><div class="prog-bg"><div class="prog-fill" style="width:${pct}%;background:${catColor(cat)}"></div></div></div>`;
  }).join('');
}

function renderRecent(){
  const tx=[...manualMonthTx()].sort((a,b)=>txDateTime(b).localeCompare(txDateTime(a))).slice(0,6);
  if(!tx.length){document.getElementById('recent').innerHTML='<p class="empty">No transactions yet</p>';return;}
  document.getElementById('recent').innerHTML=tx.map(t=>`
    <div class="tx-item">
      <div class="tx-dot" style="background:${catColor(t.cat)}"></div>
      <div class="tx-info"><div class="tx-name">${t.desc}</div><div class="tx-meta">${catLabel(t.cat)} - ${t.person} - ${txDateTime(t)}</div></div>
      <span class="tx-amt ${typeClass(t.type)}">${typeSign(t.type)}${fmt(t.amount)}</span>
    </div>`).join('');
}

function renderRecurringSummary(){
  const tx=recurringForMonth();
  const el=document.getElementById('recurring-summary');
  if(!el)return;
  if(!tx.length){el.innerHTML='<p class="empty">No recurring payments for this month</p>';return;}
  const income=tx.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);
  const expense=tx.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
  el.innerHTML=tx.map(t=>`
    <div class="tx-item">
      <div class="tx-dot" style="background:${catColor(t.cat)}"></div>
      <div class="tx-info"><div class="tx-name">${t.desc}</div><div class="tx-meta">${catLabel(t.cat)} - ${t.createdAt}</div></div>
      <span class="tx-amt ${typeClass(t.type)}">${typeSign(t.type)}${fmt(t.amount)}</span>
    </div>`).join('')+`<div style="display:flex;justify-content:space-between;padding-top:10px;font-size:13px;font-weight:600;"><span>Recurring income</span><span style="color:var(--success)">${fmt(income)}</span></div><div style="display:flex;justify-content:space-between;padding-top:4px;font-size:13px;font-weight:600;"><span>Recurring expenses</span><span style="color:var(--danger)">${fmt(expense)}</span></div>`;
}

function renderChart(){
  const canvas=document.getElementById('chart');if(!canvas)return;
  const now=new Date(),months=[];
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d.toISOString().slice(0,7));}
  const labels=months.map(m=>{const[y,mo]=m.split('-');return new Date(y,mo-1,1).toLocaleDateString('en-GB',{month:'short'});});
  const series=[
    {type:'income',color:'#5DCAA5'},
    {type:'expense',color:'#F09595'},
    {type:'savings',color:'#85B7EB'},
  ];
  const data=series.map(s=>months.map(m=>monthTx(m).filter(t=>t.type===s.type).reduce((a,t)=>a+t.amount,0)));
  const max=Math.max(1,...data.flat());
  const ratio=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  const w=Math.max(300,Math.floor(rect.width||canvas.parentElement.clientWidth||300));
  const h=Math.max(160,Math.floor(rect.height||180));
  canvas.width=w*ratio;canvas.height=h*ratio;canvas.style.width=w+'px';canvas.style.height=h+'px';
  const ctx=canvas.getContext('2d');ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);
  const left=34,right=10,top=10,bottom=28,plotW=w-left-right,plotH=h-top-bottom;
  ctx.strokeStyle='rgba(128,128,128,0.16)';ctx.lineWidth=1;ctx.font='11px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--text2')||'#777';
  for(let i=0;i<=3;i++){const y=top+plotH*i/3;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke();}
  const groupW=plotW/months.length,barW=Math.max(5,Math.min(12,groupW/5)),gap=3;
  months.forEach((m,mi)=>{
    const x0=left+mi*groupW+groupW/2-(barW*3+gap*2)/2;
    series.forEach((s,si)=>{
      const val=data[si][mi],bh=val/max*plotH,x=x0+si*(barW+gap),y=top+plotH-bh;
      ctx.fillStyle=s.color;ctx.beginPath();
      if(ctx.roundRect){ctx.roundRect(x,y,barW,bh,3);}else{ctx.rect(x,y,barW,bh);}
      ctx.fill();
    });
    ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--text2')||'#777';
    ctx.textAlign='center';ctx.fillText(labels[mi],left+mi*groupW+groupW/2,h-8);
  });
}

function renderTxList(){
  const ftype=document.getElementById('filter-type').value;
  const fperson=document.getElementById('filter-person').value;
  let tx=[...monthTx()].sort((a,b)=>txDateTime(b).localeCompare(txDateTime(a)));
  if(ftype)tx=tx.filter(t=>t.type===ftype);
  if(fperson)tx=tx.filter(t=>t.person===fperson);
  if(!tx.length){document.getElementById('tx-list').innerHTML='<p class="empty">No transactions found</p>';return;}
  document.getElementById('tx-list').innerHTML=tx.map(t=>{
    const idx=transactions.indexOf(t);
    return`<div class="tx-item">
      <div class="tx-dot" style="background:${catColor(t.cat)}"></div>
      <div class="tx-info"><div class="tx-name">${t.desc}<span class="badge badge-${typeClass(t.type)}">${typeLabel(t.type)}</span></div><div class="tx-meta">${catLabel(t.cat)} - ${t.person} - ${txDateTime(t)}</div></div>
      <span class="tx-amt ${typeClass(t.type)}">${typeSign(t.type)}${fmt(t.amount)}</span>
      ${t.recurring?'<span class="badge badge-expense">Recurring</span>':`<button class="btn-del" onclick="deleteTxRemote(${idx})">Delete</button>`}
    </div>`;
  }).join('');
}

function renderRecurringInputs(){
  const el=document.getElementById('rec-monthly');
  if(!el)return;
  if(!recurring.length){el.innerHTML='<p class="empty">No recurring payments yet. Add a salary or tick Repeat this expense every month.</p>';return;}
  el.innerHTML=recurring.map((item,i)=>`
    <div class="tx-item">
      <div class="tx-dot" style="background:${catColor(item.cat)}"></div>
      <div class="tx-info">
        <div class="tx-name">${item.desc}<span class="badge badge-${typeClass(typeFromSheet(item.type||'expense'))}">${typeLabel(typeFromSheet(item.type||'expense'))}</span></div>
        <div class="tx-meta">${catLabel(item.cat)} - ${item.person||'Recurring'} - ${item.frequency==='weekly'?'Weekly':'Monthly'}</div>
      </div>
      <span class="tx-amt ${typeClass(typeFromSheet(item.type||'expense'))}">${typeSign(typeFromSheet(item.type||'expense'))}${fmt(parseFloat(item.amount)||0)}</span>
      <button class="btn-del" onclick="deleteRecurring(${i})">Delete</button>
    </div>`).join('');
}

function deleteRecurring(index){
  if(!confirm('Delete this recurring expense?'))return;
  recurring.splice(index,1);
  saveLocal();
  renderAll();
}

function renderBudgetInputs(){
  document.getElementById('budget-inputs').innerHTML=EXPENSE_CATS.map(c=>`
    <div class="cat-row"><div class="tx-dot" style="background:${c.color}"></div><span class="clabel">${c.label}</span>
    <input type="number" id="bg-${c.id}" value="${budgets[c.id]||''}" placeholder="—" min="0" step="1" inputmode="numeric" style="text-align:right;"></div>`).join('');
}

function saveBudgets(){
  EXPENSE_CATS.forEach(c=>{const el=document.getElementById('bg-'+c.id);if(el&&el.value)budgets[c.id]=parseFloat(el.value);else delete budgets[c.id];});
  saveLocal();
  const msg=document.getElementById('b-msg');msg.textContent='Goals saved.';
  setTimeout(()=>msg.textContent='',2000);renderBudgetStatus();
}

function renderBudgetStatus(){
  const totals={};
  monthTx().filter(t=>t.type==='expense').forEach(t=>{totals[t.cat]=(totals[t.cat]||0)+t.amount;});
  const rows=Object.entries(budgets).filter(([,v])=>v>0);
  if(!rows.length){document.getElementById('budget-status').innerHTML='<p class="empty">No goals set yet</p>';return;}
  document.getElementById('budget-status').innerHTML=rows.map(([cat,bgt])=>{
    const spent=totals[cat]||0,pct=Math.min(Math.round(spent/bgt*100),100);
    const col=spent>bgt?'#E24B4A':pct>75?'#EF9F27':'#1D9E75';
    return`<div style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;font-size:13px;"><span>${catLabel(cat)}</span><span style="color:${spent>bgt?'var(--danger)':'var(--text2)'}">${fmt(spent)} / ${fmt(bgt)}</span></div><div class="prog-bg"><div class="prog-fill" style="width:${pct}%;background:${col}"></div></div></div>`;
  }).join('');
}

function renderAll(){
  ['ml1','ml2','ml3','ml4'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=monthName(currentMonth);});
  renderMetrics();renderCatSummary();renderRecent();renderRecurringSummary();renderTxList();renderRecurringInputs();renderBudgetInputs();renderBudgetStatus();
}

loadLocal();
updateCatOptions();
document.getElementById('f-date').value=new Date().toISOString().slice(0,10);
renderAll();
renderChart();
syncNow();
setInterval(syncNow, 60000);
</script>
